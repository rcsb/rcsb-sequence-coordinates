image:
  repository: harbor.devops.k8s.rcsb.org/rcsb/rcsb-sequence-coordinates
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: "production"

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilization: 6000m
  targetMemoryUtilization: 60Gi

ingress:
  enabled: true
  className: "haproxy"
  annotations:
    cert-manager.io/cluster-issuer: rutgers-acme
    kubernetes.io/tls-acme: "true"
  hosts:
    - host: seqcoordinates.k8s.rcsb.org
      # no coast: this name can resolve to either cluster, so both request its cert
      paths:
        - path: /
          pathType: ImplementationSpecific
    - host: seqcoordinates.east.k8s.rcsb.org
      coast: east
      paths:
        - path: /
          pathType: ImplementationSpecific
    - host: seqcoordinates.west.k8s.rcsb.org
      coast: west
      paths:
        - path: /
          pathType: ImplementationSpecific
    - host: sequence-coordinates.rcsb.org
      # no coast: this name can resolve to either cluster, so both request its cert
      paths:
        - path: /
          pathType: ImplementationSpecific
    - host: sequence-coordinates-west.rcsb.org
      coast: west
      paths:
        - path: /
          pathType: ImplementationSpecific
    - host: sequence-coordinates-east.rcsb.org
      coast: east
      paths:
        - path: /
          pathType: ImplementationSpecific
  # One single-name cert per host in ingress.hosts (secret <host>-tls); the current
  # ACME provider rejects multi-SAN requests. A host's `coast` is the cluster whose
  # DNS it resolves to; only that cluster requests its cert (ingress.coast is set by
  # ArgoCD from the cluster's regionID).
  tlsPerHost: true

# App specific configurations
seqcoordAppProperties:
  seqcoord.a.app.properties: |-
    spring.data.mongodb.host=production-mongodb-borrego-a-svc.production.svc.cluster.local
    spring.data.mongodb.database=annot
    spring.data.mongodb.authentication-database=admin
    spring.data.mongodb.replica-set-name=production-mongodb-borrego-a
    spring.data.mongodb.ssl.enabled=false    
    seqcoords.mongo-db-uri-scheme=mongodb+srv
    seqcoords.read-preference=secondaryPreferred
  seqcoord.b.app.properties: |-
    spring.data.mongodb.host=production-mongodb-borrego-b-svc.production.svc.cluster.local
    spring.data.mongodb.database=annot
    spring.data.mongodb.authentication-database=admin
    spring.data.mongodb.replica-set-name=production-mongodb-borrego-b
    spring.data.mongodb.ssl.enabled=false    
    seqcoords.mongo-db-uri-scheme=mongodb+srv
    seqcoords.read-preference=secondaryPreferred
